<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión para Iglesias - Tesorería</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #F8F9FA; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 550px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { color: #1B4965; margin-top: 0; border-bottom: 2px solid #52B788; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background-color: #1B4965; color: #fff; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-size: 15px; }
        .btn:hover { background-color: #13364b; }
        .link-consulta { display: inline-block; margin-top: 15px; color: #1B4965; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Registro de Diezmos y Ofrendas</h2>
        <form action="AporteServlet" method="POST">
            <div class="form-group">
                <label for="tipoAporte">Tipo de Aporte:</label>
                <select id="tipoAporte" name="tipoAporte" required>
                    <option value="Diezmo">Diezmo</option>
                    <option value="Ofrenda">Ofrenda</option>
                </select>
            </div>
            <div class="form-group">
                <label for="nombreFeligres">Nombre del Feligrés (Opcional para ofrenda):</label>
                <input type="text" id="nombreFeligres" name="nombreFeligres" placeholder="Ej. Juan Pérez">
            </div>
            <div class="form-group">
                <label for="monto">Monto ($ COP):</label>
                <input type="number" id="monto" name="monto" step="100" min="100" required placeholder="Ej. 50000">
            </div>
            <button type="submit" class="btn">Guardar Registro (POST)</button>
        </form>

        <a href="AporteServlet?accion=listar" class="link-consulta">Ver historial de aportes registrados (GET) &rarr;</a>
    </div>
</body>
</html>
